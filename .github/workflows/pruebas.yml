name: Pruebas MasterMusic

on:
  push:
    branches:
      - fix/validaciones-autenticacion
      - feat/api-pedidos
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "MasterMusic_CI_SQL_2026!"
        ports:
          - 1433:1433

    env:
      # Credencial del contenedor temporal creado para este trabajo de pruebas.
      MASTERMUSIC_TEST_SQL: "Server=localhost,1433;User ID=sa;Password=MasterMusic_CI_SQL_2026!;Encrypt=True;TrustServerCertificate=True"

    steps:
      - name: Esperar a SQL Server de pruebas
        shell: bash
        run: |
          for intento in {1..30}; do
            if docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MasterMusic_CI_SQL_2026!' -C -Q 'SELECT 1' -b > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs ${{ job.services.sqlserver.id }}
          exit 1
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore MasterMusic.slnx

      - name: Compilar
        run: dotnet build MasterMusic.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: >
          dotnet test MasterMusic.Tests/MasterMusic.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=pruebas.trx"
          --results-directory TestResults

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults/*.trx
          if-no-files-found: warn