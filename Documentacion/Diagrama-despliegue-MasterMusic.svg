<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1350" viewBox="0 0 1680 1350" role="img" aria-labelledby="title description"><title id="title">MasterMusic: diagrama de despliegue local</title><desc id="description">Vite sirve el cliente React por HTTP 5173. El navegador llama a catálogo por HTTPS 7052 y pedidos por HTTPS 7267. La API de pedidos llama al catálogo con JWT y X-Service-Key. Cada API usa exclusivamente su base SQL mediante EF Core. Ambas bases están en la instancia local SQLEXPRESS.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#526e7a"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1680" height="1350" fill="#ffffff"/><rect x="42" y="42" width="10" height="58" rx="5" fill="#147a78"/><text x="74" y="70" font-size="30" font-weight="700" text-anchor="start" fill="#193441">MasterMusic</text><text x="74" y="101" font-size="23" font-weight="400" text-anchor="start" fill="#526e7a">Diagrama de despliegue local · Trabajo 3</text><text x="1600" y="90" font-size="16" font-weight="600" text-anchor="end" fill="#526e7a">22 NOV 2026</text><rect x="40" y="135" width="1600" height="1100" rx="24" fill="#f8fafb" stroke="#b5c7d0" stroke-width="2" stroke-dasharray="9 7"/><text x="70" y="177" font-size="18" font-weight="600" text-anchor="start" fill="#526e7a">EQUIPO WINDOWS · ENTORNO DEVELOPMENT</text><rect x="150" y="980" width="1380" height="230" rx="20" fill="#ffffff" stroke="#c6d4dc" stroke-width="2"/><g fill="none" stroke="#526e7a" stroke-width="2.5" marker-end="url(#arrow)"><path d="M480 275 H598"/><path d="M720 340 V435 H440 V543"/><path d="M960 340 V435 H1240 V543"/><path d="M980 635 H702"/><path d="M440 730 V1033"/><path d="M1240 730 V1033"/></g><text x="540" y="253" font-size="15" font-weight="600" text-anchor="middle" fill="#193441">HTTP 5173</text><text x="580" y="417" font-size="17" font-weight="600" text-anchor="middle" fill="#193441">HTTPS 7052 · JSON / JWT</text><text x="1100" y="417" font-size="17" font-weight="600" text-anchor="middle" fill="#193441">HTTPS 7267 · JSON / JWT</text><text x="840" y="591" font-size="18" font-weight="600" text-anchor="middle" fill="#193441">HTTPS 7052</text><text x="840" y="619" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">JWT + X-Service-Key</text><text x="840" y="662" font-size="17" font-weight="400" text-anchor="middle" fill="#193441">HTTP tipado · 5 s</text><rect x="90" y="210" width="390" height="130" rx="18" fill="#e8f3f2" stroke="#147a78" stroke-width="2"/><text x="285" y="252" font-size="25" font-weight="600" text-anchor="middle" fill="#193441">Node.js / Vite</text><text x="285" y="286" font-size="19" font-weight="400" text-anchor="middle" fill="#193441">Servidor de archivos del cliente</text><text x="285" y="317" font-size="19" font-weight="400" text-anchor="middle" fill="#193441">http://localhost:5173</text><rect x="600" y="210" width="480" height="130" rx="18" fill="#e8f3f2" stroke="#147a78" stroke-width="2"/><text x="840" y="252" font-size="25" font-weight="600" text-anchor="middle" fill="#193441">Navegador · Cliente React</text><text x="840" y="287" font-size="19" font-weight="400" text-anchor="middle" fill="#193441">React se ejecuta en el navegador</text><text x="840" y="317" font-size="19" font-weight="400" text-anchor="middle" fill="#193441">Catálogo, pedidos e inventario</text><rect x="180" y="545" width="520" height="185" rx="18" fill="#eff5fb" stroke="#376b8f" stroke-width="2"/><text x="440" y="588" font-size="27" font-weight="600" text-anchor="middle" fill="#193441">MasterMusic.Api</text><text x="440" y="625" font-size="22" font-weight="400" text-anchor="middle" fill="#193441">https://localhost:7052</text><text x="440" y="664" font-size="20" font-weight="400" text-anchor="middle" fill="#193441">Catálogo, usuarios e inventario</text><text x="440" y="698" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">ASP.NET Core / Kestrel · Swagger</text><rect x="980" y="545" width="520" height="185" rx="18" fill="#eff5fb" stroke="#376b8f" stroke-width="2"/><text x="1240" y="588" font-size="27" font-weight="600" text-anchor="middle" fill="#193441">MasterMusic.Ventas.Api</text><text x="1240" y="625" font-size="22" font-weight="400" text-anchor="middle" fill="#193441">https://localhost:7267</text><text x="1240" y="664" font-size="20" font-weight="400" text-anchor="middle" fill="#193441">Pedidos y operaciones</text><text x="1240" y="698" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">ASP.NET Core / Kestrel · Swagger</text><rect x="300" y="822" width="280" height="100" rx="18" fill="#f8fafb" stroke="#f8fafb" stroke-width="2"/><text x="440" y="850" font-size="20" font-weight="600" text-anchor="middle" fill="#193441">EF Core / SqlClient</text><text x="440" y="877" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">Autenticación Windows</text><text x="440" y="904" font-size="17" font-weight="400" text-anchor="middle" fill="#193441">Contexto de catálogo</text><rect x="1100" y="822" width="280" height="100" rx="18" fill="#f8fafb" stroke="#f8fafb" stroke-width="2"/><text x="1240" y="850" font-size="20" font-weight="600" text-anchor="middle" fill="#193441">EF Core / SqlClient</text><text x="1240" y="877" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">Autenticación Windows</text><text x="1240" y="904" font-size="17" font-weight="400" text-anchor="middle" fill="#193441">Contexto de pedidos</text><text x="840" y="1019" font-size="23" font-weight="600" text-anchor="middle" fill="#193441">SQL Server Express · Instancia .\SQLEXPRESS</text><ellipse cx="440" cy="1149" rx="235" ry="18" fill="#fff4e9" stroke="#b76826" stroke-width="2"/><rect x="205" y="1054" width="470" height="95" fill="#fff4e9"/><path d="M205 1054 V1149 M675 1054 V1149" stroke="#b76826" stroke-width="2"/><ellipse cx="440" cy="1054" rx="235" ry="18" fill="#fffaf5" stroke="#b76826" stroke-width="2"/><text x="440" y="1108" font-size="25" font-weight="600" text-anchor="middle" fill="#193441">MasterMusicDB</text><text x="440" y="1137" font-size="17" font-weight="400" text-anchor="middle" fill="#193441">Datos propios del catálogo</text><ellipse cx="1240" cy="1149" rx="235" ry="18" fill="#fff4e9" stroke="#b76826" stroke-width="2"/><rect x="1005" y="1054" width="470" height="95" fill="#fff4e9"/><path d="M1005 1054 V1149 M1475 1054 V1149" stroke="#b76826" stroke-width="2"/><ellipse cx="1240" cy="1054" rx="235" ry="18" fill="#fffaf5" stroke="#b76826" stroke-width="2"/><text x="1240" y="1108" font-size="25" font-weight="600" text-anchor="middle" fill="#193441">MasterMusicVentasDB</text><text x="1240" y="1137" font-size="17" font-weight="400" text-anchor="middle" fill="#193441">Datos propios de pedidos</text><text x="840" y="1193" font-size="17" font-weight="400" text-anchor="middle" fill="#526e7a">Dos bases independientes alojadas en una misma instancia SQL</text><text x="62" y="1277" font-size="19" font-weight="400" text-anchor="start" fill="#526e7a">Cada API accede exclusivamente a su base. La comunicación entre APIs utiliza HTTPS.</text><text x="62" y="1310" font-size="18" font-weight="400" text-anchor="start" fill="#526e7a">Escuchas HTTP auxiliares: catálogo 5169 · pedidos 5033. El cliente utiliza HTTPS para las APIs.</text></g></svg>