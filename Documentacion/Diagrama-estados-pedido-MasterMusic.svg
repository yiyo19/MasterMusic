<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1030" viewBox="0 0 1580 1030" role="img" aria-labelledby="title description"><title id="title">MasterMusic: estados del pedido</title><desc id="description">La creación verificada produce un pedido Pendiente y descuenta stock. El Administrador puede confirmarlo sin otro descuento, o cancelarlo con motivo después de verificar la devolución única. Confirmado y Cancelado terminan el ciclo de cambios y permanecen disponibles para consulta. Las operaciones inciertas se recuperan con los identificadores originales.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#526e7a"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1580" height="1030" fill="#ffffff"/><rect x="42" y="42" width="10" height="58" rx="5" fill="#147a78"/><text x="74" y="70" font-size="30" font-weight="700" text-anchor="start" fill="#193441">MasterMusic</text><text x="74" y="101" font-size="23" font-weight="400" text-anchor="start" fill="#526e7a">Diagrama de estados del pedido · Trabajo 3</text><text x="1505" y="90" font-size="16" font-weight="600" text-anchor="end" fill="#526e7a">22 NOV 2026</text><rect x="40" y="135" width="1500" height="795" rx="24" fill="#f8fafb" stroke="#d0dce1" stroke-width="2"/><text x="70" y="178" font-size="18" font-weight="600" text-anchor="start" fill="#526e7a">CICLO DE VIDA DE LA ENTIDAD PEDIDO</text><g fill="none" stroke="#526e7a" stroke-width="2.5" marker-end="url(#arrow)"><path d="M119 470 H328"/><path d="M530 390 V310 H988"/><path d="M530 550 V730 H988"/><path d="M1400 310 H1451"/><path d="M1400 730 H1451"/></g><circle cx="105" cy="470" r="14" fill="#193441"/><text x="225" y="438" font-size="19" font-weight="600" text-anchor="middle" fill="#193441">Crear · Cliente</text><text x="225" y="500" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">Descuento verificado</text><text x="760" y="275" font-size="21" font-weight="600" text-anchor="middle" fill="#193441">Confirmar · Administrador</text><text x="760" y="343" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">Pedido pendiente</text><text x="760" y="694" font-size="21" font-weight="600" text-anchor="middle" fill="#193441">Cancelar · Administrador</text><text x="760" y="765" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">Motivo y devolución verificada</text><rect x="330" y="390" width="400" height="160" rx="22" fill="#fff5df" stroke="#b48221" stroke-width="2"/><path d="M330 457 H730" stroke="#b48221" stroke-width="1.5"/><text x="530" y="438" font-size="29" font-weight="600" text-anchor="middle" fill="#193441">Pendiente</text><text x="530" y="495" font-size="20" font-weight="400" text-anchor="middle" fill="#193441">Stock descontado al crear</text><text x="530" y="525" font-size="19" font-weight="400" text-anchor="middle" fill="#193441">Admite confirmar o cancelar</text><rect x="990" y="230" width="410" height="160" rx="22" fill="#e8f3f2" stroke="#147a78" stroke-width="2"/><path d="M990 297 H1400" stroke="#147a78" stroke-width="1.5"/><text x="1195" y="278" font-size="29" font-weight="600" text-anchor="middle" fill="#193441">Confirmado</text><text x="1195" y="335" font-size="20" font-weight="400" text-anchor="middle" fill="#193441">Conserva el descuento inicial</text><text x="1195" y="365" font-size="19" font-weight="400" text-anchor="middle" fill="#193441">No vuelve a descontar stock</text><rect x="990" y="650" width="410" height="160" rx="22" fill="#fbefee" stroke="#a66560" stroke-width="2"/><path d="M990 717 H1400" stroke="#a66560" stroke-width="1.5"/><text x="1195" y="698" font-size="29" font-weight="600" text-anchor="middle" fill="#193441">Cancelado</text><text x="1195" y="755" font-size="20" font-weight="400" text-anchor="middle" fill="#193441">Devuelve el stock una vez</text><text x="1195" y="785" font-size="19" font-weight="400" text-anchor="middle" fill="#193441">Guarda el motivo de cancelación</text><circle cx="1470" cy="310" r="16" fill="#ffffff" stroke="#193441" stroke-width="2"/><circle cx="1470" cy="310" r="10" fill="#193441"/><circle cx="1470" cy="730" r="16" fill="#ffffff" stroke="#193441" stroke-width="2"/><circle cx="1470" cy="730" r="10" fill="#193441"/><rect x="65" y="638" width="390" height="194" rx="16" fill="#ffffff" stroke="#c6d4dc" stroke-width="1.5"/><text x="260" y="669" font-size="19" font-weight="600" text-anchor="middle" fill="#193441">Si se pierde una respuesta</text><text x="260" y="700" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">La operación se conserva.</text><text x="260" y="727" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">El pedido puede seguir Pendiente</text><text x="260" y="754" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">hasta verificar la devolución.</text><text x="260" y="785" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">Se recupera con los mismos</text><text x="260" y="812" font-size="18" font-weight="400" text-anchor="middle" fill="#193441">identificadores, sin duplicar stock.</text><text x="790" y="889" font-size="19" font-weight="400" text-anchor="middle" fill="#526e7a">Confirmado y Cancelado cierran el ciclo de cambios. El pedido permanece almacenado y consultable.</text><text x="62" y="975" font-size="18" font-weight="400" text-anchor="start" fill="#526e7a">Una nueva transición sobre un pedido final devuelve 409: ESTADO_PEDIDO_INVALIDO.</text><text x="62" y="1006" font-size="18" font-weight="400" text-anchor="start" fill="#526e7a">Reintentar la misma operación con su clave y datos recupera el resultado, sin repetir sus efectos.</text></g></svg>