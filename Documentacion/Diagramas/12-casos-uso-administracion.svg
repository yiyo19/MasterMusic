ect x="945.25" y="1213" width="99.5" height="28" fill="white"/><text x="995" y="1234" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">«include»</text><g fill="none" stroke="#3c7775" stroke-width="3"><circle cx="110.0" cy="208" r="18"/><path d="M110.0 226 V285 M72.0 250 H148.0 M110.0 285 L74.0 330 M110.0 285 L146.0 330"/></g><text x="110.0" y="360" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Usuario web</text><g fill="none" stroke="#3c7775" stroke-width="3"><circle cx="110.0" cy="818" r="18"/><path d="M110.0 836 V895 M72.0 860 H148.0 M110.0 895 L74.0 940 M110.0 895 L146.0 940"/></g><text x="110.0" y="970" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Administrador</text><text x="1240.0" y="279.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">Requiere sesión con rol Administrador.</text><text x="1240.0" y="307.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">Hereda catálogo, detalle y sesión de Usuario web.</text><text x="1240.0" y="335.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">No hereda los permisos exclusivos del Cliente.</text><ellipse cx="660.0" cy="290.0" rx="240.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="660.0" y="283.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Gestionar instrumentos</text><text x="660.0" y="311.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-06 a RF-10</text><ellipse cx="660.0" cy="450.0" rx="240.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="660.0" y="443.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Gestionar categorías (CRUD)</text><text x="660.0" y="471.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-11</text><ellipse cx="660.0" cy="610.0" rx="240.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="660.0" y="603.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Gestionar marcas (CRUD)</text><text x="660.0" y="631.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-12</text><ellipse cx="660.0" cy="770.0" rx="240.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="660.0" y="763.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Registrar entrada de stock</text><text x="660.0" y="791.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-13</text><ellipse cx="660.0" cy="930.0" rx="240.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="660.0" y="923.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Consultar todos los pedidos</text><text x="660.0" y="951.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-19</text><ellipse cx="660.0" cy="1090.0" rx="240.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="660.0" y="1083.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Confirmar pedido Pendiente</text><text x="660.0" y="1111.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-20/21</text><ellipse cx="660.0" cy="1250.0" rx="240.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="660.0" y="1243.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Cancelar pedido Pendiente</text><text x="660.0" y="1271.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-20/21</text><ellipse cx="660.0" cy="1470.0" rx="240.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="660.0" y="1463.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Recuperar operación incierta</text><text x="660.0" y="1491.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-22</text><text x="1245.0" y="499.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">Gestionar instrumentos comprende:</text><text x="1245.0" y="527.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">consultar, crear, editar, activar, desactivar</text><text x="1245.0" y="555.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">y eliminar cuando las reglas lo permitan.</text><text x="1245.0" y="944.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">Confirmar no vuelve a descontar stock.</text><text x="1245.0" y="972.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">Confirmado y Cancelado son estados finales.</text><text x="1245.0" y="1000.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">No se eliminan pedidos.</text><ellipse cx="1290.0" cy="1250.0" rx="200.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="1290.0" y="1243.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Devolver stock una sola vez</text><text x="1290.0" y="1271.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-21</text><text x="1265.0" y="1409.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">Cancelar exige un motivo.</text><text x="1265.0" y="1437.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">La devolución se verifica antes de</text><text x="1265.0" y="1465.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">marcar el pedido Cancelado.</text><text x="40" y="1638" font-family="Arial" font-size="16" fill="#536e7a">MasterMusic · Fuente draw.io incluida · Asociaciones sin dirección; dependencias UML con flecha abierta</text></svg>