 stroke="#3c7775" stroke-width="2"/><text x="600.0" y="263.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Registrarse como Cliente</text><text x="600.0" y="291.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-01</text><ellipse cx="600.0" cy="430.0" rx="180.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="600.0" y="423.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Iniciar sesión</text><text x="600.0" y="451.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-02</text><ellipse cx="600.0" cy="590.0" rx="180.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="600.0" y="583.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Cerrar sesión</text><text x="600.0" y="611.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-03</text><ellipse cx="600.0" cy="750.0" rx="180.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="600.0" y="743.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Consultar catálogo</text><text x="600.0" y="771.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-04</text><ellipse cx="1240.0" cy="750.0" rx="190.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="1240.0" y="743.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">Consultar detalle</text><text x="1240.0" y="771.0" text-anchor="middle" font-family="Arial" font-size="21" fill="#193441">RF-05</text><text x="1240.0" y="837.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">[al seleccionar un instrumento]</text><text x="1240.0" y="865.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#193441">punto de extensión: ver detalle</text><ellipse cx="600.0" cy="980.0" rx="180.0" ry="55.0" fill="#eef7f6" stroke="#3c7775" stroke-width="2"/><text x="600.0" y="973.0" te